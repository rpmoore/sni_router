name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - mainline
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch (installs current stable Rust)
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --locked --all-targets --all-features

      - name: Install cargo-deny
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-audit

      - name: Run cargo-audit
        run: cargo audit --deny warnings

      - name: Install reuse
        run: |
          python3 -m pip install --user reuse==6.2.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run reuse lint
        run: reuse lint

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  okf-lint:
    name: Lint OKF knowledge docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run okf-lint
        run: |
          docker run --rm -v "$PWD/docs/knowledge":/data:ro \
            rpmoore/okf-lint@sha256:5d653a1fc2bd6d007cfc181205de9fc1d1acd6874360b53688cbc4a7fc9da333 /data
